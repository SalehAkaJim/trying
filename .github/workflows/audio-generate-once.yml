name: One-shot German Pre-A1 Audio Generation

on:
  push:
    branches:
      - audio-pre-a1-unit3-generation
    paths:
      - .github/workflows/audio-generate-once.yml

permissions:
  contents: write

concurrency:
  group: one-shot-de-pre-a1-audio
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    env:
      ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
      AUDIO_DB_HOST: 127.0.0.1
      AUDIO_DB_PORT: '3306'
      AUDIO_DB_USER: root
      AUDIO_DB_PASSWORD: root
      AUDIO_DB_NAME: language_content_test
      AUDIO_MYSQL_IMAGE: mysql:9.0.1
    services:
      mysql:
        image: mysql:9.0.1
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: language_content_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s --health-timeout=5s --health-retries=12

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install JSON Schema validator
        run: python -m pip install --disable-pip-version-check jsonschema

      - name: Validate contracts before paid generation
        run: |
          python scripts/validate_json_schemas.py
          python scripts/sync_fa_labels.py
          python scripts/validate_source_localization.py
          python scripts/validate_persian_coverage.py
          python scripts/apply_mysql_localization.py --check
          python scripts/validate_project_contracts.py
          python scripts/validate_audio_contracts.py

      - name: Build canonical MySQL state
        run: bash scripts/validate_mysql_content.sh

      - name: Require ElevenLabs key
        shell: bash
        run: |
          if [ -z "$ELEVENLABS_API_KEY" ]; then
            echo 'Missing GitHub Actions secret ELEVENLABS_API_KEY.' >&2
            exit 2
          fi

      - name: Resolve and lock voices
        run: python scripts/audio_pipeline.py resolve-voices --language de

      - name: Rebuild MySQL with voice lock
        run: bash scripts/validate_mysql_content.sh

      - name: Verify exact paid-generation scope
        run: |
          python scripts/audio_pipeline.py plan --language de --level Pre-A1 > /tmp/audio-plan-before.json
          cat /tmp/audio-plan-before.json
          python - <<'PY'
          import json
          data=json.load(open('/tmp/audio-plan-before.json',encoding='utf-8'))
          if data['needsGeneration'] != 22:
              raise SystemExit(f"Expected exactly 22 new assets before paid generation, got: {data}")
          if data['unresolvedVoices'] != 0:
              raise SystemExit(f"Voices are unresolved: {data}")
          if data['currentAssets'] != 104 or data['totalRequired'] != 126:
              raise SystemExit(f"Unexpected audio scope: {data}")
          print('Paid generation scope confirmed: exactly 22 new assets.')
          PY

      - name: Generate 22 audio assets
        run: >-
          python scripts/audio_pipeline.py generate
          --language de
          --level Pre-A1
          --confirm-paid-generation

      - name: Make activity audio mapping safe for final lessons
        run: >-
          python scripts/make_audio_mapping_final_safe.py
          --language de
          --level Pre-A1

      - name: Validate generated audio assets
        run: >-
          python scripts/audio_pipeline.py validate-assets
          --language de
          --level Pre-A1

      - name: Validate audio mapping on MySQL 9.0.1
        run: |
          bash scripts/validate_mysql_content.sh
          python scripts/audio_pipeline.py plan --language de --level Pre-A1 > /tmp/audio-plan-after.json
          cat /tmp/audio-plan-after.json
          python - <<'PY'
          import json
          data=json.load(open('/tmp/audio-plan-after.json',encoding='utf-8'))
          if data['needsGeneration'] != 0 or data['unresolvedVoices'] != 0:
              raise SystemExit(f"Audio is not fully current: {data}")
          if data['currentAssets'] != 126 or data['totalRequired'] != 126:
              raise SystemExit(f"Expected 126/126 current assets: {data}")
          print('German Pre-A1 audio is fully current: 126/126.')
          PY

      - name: Sync aggregate level audio status
        run: >-
          python scripts/sync_audio_level_status.py
          --language de
          --level Pre-A1

      - name: Final validation
        run: |
          python scripts/validate_audio_contracts.py
          python scripts/sync_audio_level_status.py --language de --level Pre-A1 --check

      - name: Commit generated audio
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for path in config/audio-voice-locks database/audio audio; do
            if [ -e "$path" ]; then git add -A "$path"; fi
          done
          git add -A content/de/pre-a1/level.json
          if git diff --cached --quiet; then
            echo 'No audio changes to commit.' >&2
            exit 3
          fi
          git commit -m 'Audio generate: de Pre-A1 Unit 3'
          git push origin HEAD:audio-pre-a1-unit3-generation
