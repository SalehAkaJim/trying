name: Project Contracts

on:
  push:
    paths:
      - 'content/**'
      - 'config/**'
      - 'schemas/**'
      - 'scripts/**'
      - 'docs/**'
      - 'database/schema.sql'
      - 'database/content/**'
      - 'database/audio/**'
      - 'audio/**'
      - '.github/workflows/project-contracts.yml'
      - '.github/workflows/audio-generation.yml'
  pull_request:
    paths:
      - 'content/**'
      - 'config/**'
      - 'schemas/**'
      - 'scripts/**'
      - 'docs/**'
      - 'database/schema.sql'
      - 'database/content/**'
      - 'database/audio/**'
      - 'audio/**'
      - '.github/workflows/project-contracts.yml'
      - '.github/workflows/audio-generation.yml'

jobs:
  validate-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate machine-readable files
        run: |
          python -m json.tool config/fa-taxonomy.json >/dev/null
          python -m json.tool config/audio-pipeline.json >/dev/null
          python -m json.tool config/activity-count-bounds.json >/dev/null
          python -m json.tool config/unit-lesson-count-bounds.json >/dev/null
          python -m json.tool config/dynamic-structure-policy.json >/dev/null
          python -m json.tool schemas/fa-taxonomy.schema.json >/dev/null
          python -m json.tool schemas/lexeme.schema.json >/dev/null
          python -m json.tool schemas/source.schema.json >/dev/null
          python -m json.tool schemas/activity.schema.json >/dev/null
          python -m json.tool schemas/dialogue.schema.json >/dev/null
          python -m json.tool schemas/level.schema.json >/dev/null
          python -m json.tool schemas/audio-pipeline.schema.json >/dev/null
          python -m json.tool schemas/audio-voice-lock.schema.json >/dev/null
          python -m json.tool schemas/dynamic-structure-policy.schema.json >/dev/null

      - name: Install JSON Schema validator
        run: python -m pip install --disable-pip-version-check jsonschema

      - name: Validate content instances against JSON Schemas
        run: python scripts/validate_json_schemas.py

      - name: Validate CEFR activity-count guardrails
        run: python scripts/validate_activity_count_bounds.py

      - name: Audit dynamic Unit, Lesson, and Activity structure
        run: python scripts/audit_dynamic_structure.py

      - name: Validate interactive activity payload completeness
        run: python scripts/validate_activity_payload_completeness.py

      - name: Verify Persian companion labels are synchronized
        run: python scripts/sync_fa_labels.py

      - name: Verify assistant-authored source prose is Persian
        run: python scripts/validate_source_localization.py

      - name: Validate strict Persian coverage
        run: python scripts/validate_persian_coverage.py

      - name: Verify MySQL localization matches canonical taxonomy
        run: python scripts/apply_mysql_localization.py --check

      - name: Validate shared cross-language contracts
        run: python scripts/validate_project_contracts.py

      - name: Validate audio contracts
        run: python scripts/validate_audio_contracts.py
