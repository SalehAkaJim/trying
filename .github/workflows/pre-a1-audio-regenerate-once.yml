name: One-shot German Pre-A1 Audio Regeneration

on:
  push:
    paths:
      - '.github/pre-a1-audio-regenerate-once.trigger'

permissions:
  contents: write

concurrency:
  group: one-shot-de-pre-a1-audio
  cancel-in-progress: false

jobs:
  regenerate:
    runs-on: ubuntu-latest
    env:
      ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
      AUDIO_DB_HOST: 127.0.0.1
      AUDIO_DB_PORT: '3306'
      AUDIO_DB_USER: root
      AUDIO_DB_PASSWORD: root
      AUDIO_DB_NAME: language_content_test
      AUDIO_MYSQL_IMAGE: mysql:9.0.1
    services:
      mysql:
        image: mysql:9.0.1
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: language_content_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s --health-timeout=5s --health-retries=12
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install JSON Schema validator
        run: python -m pip install --disable-pip-version-check jsonschema
      - name: Validate project contracts
        run: |
          python scripts/validate_json_schemas.py
          python scripts/sync_fa_labels.py
          python scripts/validate_source_localization.py
          python scripts/validate_persian_coverage.py
          python scripts/apply_mysql_localization.py --check
          python scripts/validate_project_contracts.py
          python scripts/validate_audio_contracts.py
      - name: Build canonical MySQL state
        run: bash scripts/validate_mysql_content.sh
      - name: Require ElevenLabs key
        run: |
          if [ -z "$ELEVENLABS_API_KEY" ]; then
            echo 'Missing GitHub Actions secret ELEVENLABS_API_KEY.' >&2
            exit 2
          fi
      - name: Resolve voices
        run: python scripts/audio_pipeline.py resolve-voices --language de
      - name: Rebuild MySQL with voice lock
        run: bash scripts/validate_mysql_content.sh
      - name: Verify audio plan
        run: python scripts/audio_pipeline.py plan --language de --level Pre-A1
      - name: Generate Pre-A1 audio
        run: python scripts/audio_pipeline.py generate --language de --level Pre-A1 --confirm-paid-generation
      - name: Make activity audio mapping final-safe
        run: python scripts/make_audio_mapping_final_safe.py --language de --level Pre-A1
      - name: Validate generated assets
        run: python scripts/audio_pipeline.py validate-assets --language de --level Pre-A1
      - name: Validate generated mapping
        run: |
          bash scripts/validate_mysql_content.sh
          python scripts/audio_pipeline.py plan --language de --level Pre-A1 > /tmp/prea1-audio-plan.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/prea1-audio-plan.json',encoding='utf-8'))
          if d['needsGeneration'] != 0 or d['unresolvedVoices'] != 0:
              raise SystemExit(f"Pre-A1 audio is not fully current: {d}")
          print('Pre-A1 audio is fully current.')
          PY
      - name: Sync aggregate level status
        run: python scripts/sync_audio_level_status.py --language de --level Pre-A1
      - name: Commit generated assets and authoring sync
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A audio/de/pre-a1 database/audio/de config/audio-voice-locks/de.json
          git add -A content/de/pre-a1/level.json content/de/pre-a1/lessons content/de/lexemes
          if git diff --cached --quiet; then
            echo 'No Pre-A1 audio changes to commit.'
          else
            git commit -m 'Audio regenerate: de Pre-A1 after quality audit'
            git push
          fi
