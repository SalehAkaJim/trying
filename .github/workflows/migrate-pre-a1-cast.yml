name: One-off German Pre-A1 cast migration

on:
  push:
    paths:
      - '.github/workflows/migrate-pre-a1-cast.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply cast and audio-rule migrations
        run: |
          python scripts/migrate_pre_a1_cast_content.py
          python scripts/migrate_pre_a1_audio_rules.py
          rm -f scripts/migrate_pre_a1_cast_content.py scripts/migrate_pre_a1_audio_rules.py .github/workflows/migrate-pre-a1-cast.yml
      - name: Install JSON Schema validator
        run: python -m pip install --disable-pip-version-check jsonschema
      - name: Validate migrated contracts
        run: |
          python scripts/validate_json_schemas.py
          python scripts/validate_project_contracts.py
          python scripts/validate_audio_contracts.py
          python -m py_compile scripts/audio_pipeline.py
      - name: Commit migration on main
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Rebuild German Pre-A1 cast and learner voice roles'
          git push
