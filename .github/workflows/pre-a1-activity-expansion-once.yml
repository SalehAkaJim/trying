name: One-shot German Pre-A1 Activity Expansion

on:
  push:
    branches:
      - pre-a1-activity-expansion
    paths:
      - .github/workflows/pre-a1-activity-expansion-once.yml

permissions:
  contents: write

jobs:
  expand-and-validate:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:9.0.1
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: language_content_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s --health-timeout=5s --health-retries=12
    env:
      AUDIO_DB_HOST: 127.0.0.1
      AUDIO_DB_PORT: '3306'
      AUDIO_DB_USER: root
      AUDIO_DB_PASSWORD: root
      AUDIO_DB_NAME: language_content_test
      AUDIO_MYSQL_IMAGE: mysql:9.0.1
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Expand Pre-A1 activities
        run: python scripts/expand_pre_a1_activities_once.py

      - name: Install JSON Schema validator
        run: python -m pip install --disable-pip-version-check jsonschema

      - name: Validate authoring contracts
        run: |
          python scripts/validate_json_schemas.py
          python scripts/validate_activity_count_bounds.py
          python scripts/sync_fa_labels.py
          python scripts/validate_source_localization.py
          python scripts/validate_persian_coverage.py
          python scripts/apply_mysql_localization.py --check
          python scripts/validate_project_contracts.py
          python scripts/validate_audio_contracts.py

      - name: Validate MySQL runtime and idempotency
        run: bash scripts/validate_mysql_content.sh

      - name: Confirm audio remains current without new TTS
        run: |
          python scripts/audio_pipeline.py plan --language de --level Pre-A1 > /tmp/audio-plan.json
          cat /tmp/audio-plan.json
          python - <<'PY'
          import json
          p=json.load(open('/tmp/audio-plan.json', encoding='utf-8'))
          assert p['totalRequired'] == 126, p
          assert p['currentAssets'] == 126, p
          assert p['needsGeneration'] == 0, p
          assert p['unresolvedVoices'] == 0, p
          print('Audio remains fully current: 126/126; no paid generation required.')
          PY
          python scripts/sync_audio_level_status.py --language de --level Pre-A1 --check

      - name: Commit expanded curriculum
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add content/de/pre-a1/lessons content/de/pre-a1/level.json config/activity-count-bounds.json database/content/de/zzzzz-pre-a1-activity-expansion.sql
          git commit -m 'Expand German Pre-A1 activities to 3-6 per lesson'
          git push origin HEAD:pre-a1-activity-expansion
