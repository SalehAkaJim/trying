name: Audio Pre-A1 Three Lessons Once

on:
  push:
    branches:
      - audio-pre-a1-three-lessons-generation

permissions:
  contents: write

concurrency:
  group: audio-pre-a1-three-lessons-once
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    env:
      ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
      AUDIO_DB_HOST: 127.0.0.1
      AUDIO_DB_PORT: '3306'
      AUDIO_DB_USER: root
      AUDIO_DB_PASSWORD: root
      AUDIO_DB_NAME: language_content_test
      AUDIO_MYSQL_IMAGE: mysql:9.0.1
    services:
      mysql:
        image: mysql:9.0.1
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: language_content_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s --health-timeout=5s --health-retries=12
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install JSON Schema validator
        run: python -m pip install --disable-pip-version-check jsonschema
      - name: Validate contracts
        run: |
          python scripts/validate_json_schemas.py
          python scripts/sync_fa_labels.py
          python scripts/validate_source_localization.py
          python scripts/validate_persian_coverage.py
          python scripts/apply_mysql_localization.py --check
          python scripts/validate_project_contracts.py
          python scripts/validate_audio_contracts.py
      - name: Build canonical MySQL state
        run: bash scripts/validate_mysql_content.sh
      - name: Confirm exact paid scope before generation
        run: |
          python scripts/audio_pipeline.py plan --language de --level Pre-A1 > /tmp/audio-plan-before.json
          cat /tmp/audio-plan-before.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/audio-plan-before.json',encoding='utf-8'))
          expected={'totalRequired':144,'currentAssets':126,'needsGeneration':18,'unresolvedVoices':0}
          for k,v in expected.items():
              if d.get(k) != v:
                  raise SystemExit(f'Unexpected paid scope: {k}={d.get(k)!r}, expected {v!r}; full plan={d}')
          if d.get('voiceLockPresent') is not True:
              raise SystemExit(f'Voice lock missing: {d}')
          print('Paid scope confirmed: exactly 18 new assets.')
          PY
      - name: Require ElevenLabs key
        shell: bash
        run: |
          if [ -z "$ELEVENLABS_API_KEY" ]; then
            echo 'Missing GitHub Actions secret ELEVENLABS_API_KEY.' >&2
            exit 2
          fi
      - name: Resolve voices
        run: python scripts/audio_pipeline.py resolve-voices --language de
      - name: Rebuild MySQL with voice lock
        run: bash scripts/validate_mysql_content.sh
      - name: Reconfirm exact scope after voice resolution
        run: |
          python scripts/audio_pipeline.py plan --language de --level Pre-A1 > /tmp/audio-plan-resolved.json
          cat /tmp/audio-plan-resolved.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/audio-plan-resolved.json',encoding='utf-8'))
          if d.get('needsGeneration') != 18 or d.get('unresolvedVoices') != 0:
              raise SystemExit(f'Unexpected resolved scope: {d}')
          PY
      - name: Generate exactly missing audio
        run: python scripts/audio_pipeline.py generate --language de --level Pre-A1 --confirm-paid-generation
      - name: Make activity audio mapping safe for final lessons
        run: python scripts/make_audio_mapping_final_safe.py --language de --level Pre-A1
      - name: Validate audio assets
        run: python scripts/audio_pipeline.py validate-assets --language de --level Pre-A1
      - name: Validate audio mapping on MySQL
        run: |
          bash scripts/validate_mysql_content.sh
          python scripts/audio_pipeline.py plan --language de --level Pre-A1 > /tmp/audio-plan-after.json
          cat /tmp/audio-plan-after.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/audio-plan-after.json',encoding='utf-8'))
          expected={'totalRequired':144,'currentAssets':144,'needsGeneration':0,'unresolvedVoices':0}
          for k,v in expected.items():
              if d.get(k) != v:
                  raise SystemExit(f'Audio not complete: {k}={d.get(k)!r}, expected {v!r}; full plan={d}')
          print('Audio complete: 144/144.')
          PY
      - name: Sync aggregate level status
        run: python scripts/sync_audio_level_status.py --language de --level Pre-A1
      - name: Commit generated assets
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A config/audio-voice-locks database/audio audio content/de/pre-a1/level.json
          if git diff --cached --quiet; then
            echo 'No audio changes to commit.'
          else
            git commit -m 'Audio generate: de Pre-A1 lessons 20-22'
            git push
          fi
