name: One-time Persian coverage migration

on:
  push:
    paths:
      - 'scripts/fix_persian_coverage_temp.py'
      - 'scripts/fix_persian_coverage_round2_temp.py'
      - '.github/workflows/persian-coverage-temp.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply Persian coverage migration
        run: |
          python scripts/fix_persian_coverage_temp.py
          python scripts/fix_persian_coverage_round2_temp.py
      - name: Synchronize MySQL taxonomy seed
        run: python scripts/apply_mysql_localization.py
      - name: Install schema validator
        run: python -m pip install --disable-pip-version-check jsonschema
      - name: Validate migrated authoring
        run: |
          python scripts/validate_json_schemas.py
          python scripts/sync_fa_labels.py
          python scripts/validate_source_localization.py
          python scripts/validate_persian_coverage.py
          python scripts/validate_project_contracts.py
          python scripts/validate_audio_contracts.py
          python scripts/apply_mysql_localization.py --check
      - name: Commit migrated files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add content config schemas scripts docs database
          if git diff --cached --quiet; then
            echo 'No migration changes.'
          else
            git commit -m 'Enforce complete Persian content localization'
            git push
          fi
