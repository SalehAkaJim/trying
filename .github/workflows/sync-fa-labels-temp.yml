name: One-time Persian label migration

on:
  push:
    paths:
      - '.github/workflows/sync-fa-labels-temp.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Sync labels and remove temporary workflow
        run: |
          python scripts/sync_fa_labels.py --write
          git rm .github/workflows/sync-fa-labels-temp.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add content/de/lexemes
          git commit -m 'Backfill Persian part-of-speech labels'
          git push
