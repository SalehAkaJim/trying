name: Pre-A1 SQL Sync

on:
  push:
    branches:
      - fix/pre-a1-activity-bounds
    paths:
      - '.github/workflows/pre-a1-sql-sync.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/pre-a1-activity-bounds
          fetch-depth: 0

      - name: Apply SQL synchronization
        run: python scripts/apply_pre_a1_activity_guardrail_sql_patch.py

      - name: Verify generated diff
        run: |
          git diff --check
          git diff --exit-code -- database/content/de/pre-a1.sql scripts/validate_mysql_content.sh && {
            echo 'Expected synchronization diff was not produced.'
            exit 1
          } || true

      - name: Commit synchronized SQL and MySQL validator
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add database/content/de/pre-a1.sql scripts/validate_mysql_content.sh
          git commit -m 'Sync Pre-A1 activity guardrails to MySQL'
          git push origin HEAD:fix/pre-a1-activity-bounds
