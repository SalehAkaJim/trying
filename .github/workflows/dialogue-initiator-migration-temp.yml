name: One-time dialogue starter relational migration

on:
  push:
    paths:
      - '.github/workflows/dialogue-initiator-migration-temp.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fix dialogue insert value order
        run: |
          python - <<'PY'
          import pathlib

          def split_fields(inner):
              fields=[]; buf=[]; in_quote=False; i=0
              while i < len(inner):
                  ch=inner[i]
                  if ch=="'":
                      buf.append(ch)
                      if in_quote and i+1 < len(inner) and inner[i+1]=="'":
                          buf.append("'"); i += 2; continue
                      in_quote = not in_quote
                      i += 1; continue
                  if ch==',' and not in_quote:
                      fields.append(''.join(buf).strip()); buf=[]; i += 1; continue
                  buf.append(ch); i += 1
              fields.append(''.join(buf).strip())
              return fields

          changed=[]
          for path in pathlib.Path('database/content').rglob('*.sql'):
              text=path.read_text(encoding='utf-8')
              header='INSERT INTO dialogues (dialogue_key,language_level_id,scenario,opening_initiator,scene_quality_rationale) VALUES'
              if header not in text:
                  continue
              lines=text.splitlines(); in_block=False; out=[]; touched=False
              for line in lines:
                  if line.strip()==header:
                      in_block=True; out.append(line); continue
                  if in_block and line.startswith('ON DUPLICATE KEY UPDATE'):
                      in_block=False
                  if in_block and line.startswith("('dlg-"):
                      comma=line.endswith('),')
                      raw=line[:-1] if comma else line
                      if raw.endswith(')'):
                          inner=raw[1:-1]
                          fields=split_fields(inner)
                          if len(fields)==5:
                              f3=fields[3].strip("'")
                              f4=fields[4].strip("'")
                              if f3 not in {'app','learner'} and f4 in {'app','learner'}:
                                  fields=[fields[0],fields[1],fields[2],fields[4],fields[3]]
                                  line='(' + ','.join(fields) + ')' + (',' if comma else '')
                                  touched=True
                  out.append(line)
              if touched:
                  path.write_text('\n'.join(out)+('\n' if text.endswith('\n') else ''),encoding='utf-8')
                  changed.append(str(path))
          if not changed:
              raise SystemExit('No dialogue rows required correction')
          print('Corrected:', *changed, sep='\n- ')
          PY

      - name: Commit correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add database/content
          git commit -m "Fix relational dialogue starter SQL order"
          git push
