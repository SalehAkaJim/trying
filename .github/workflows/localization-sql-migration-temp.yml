name: One-time MySQL localization migration

on:
  push:
    paths:
      - '.github/workflows/localization-sql-migration-temp.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply migration
        run: python scripts/apply_mysql_localization.py
      - name: Commit migration
        run: |
          git rm .github/workflows/localization-sql-migration-temp.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add database
          git commit -m 'Store Persian semantic taxonomy in MySQL'
          git push
