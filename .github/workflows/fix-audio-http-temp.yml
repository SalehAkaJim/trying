name: One-time audio HTTP fix

on:
  push:
    paths:
      - 'scripts/fix_audio_http_temp.py'
      - '.github/workflows/fix-audio-http-temp.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply patch
        run: python scripts/fix_audio_http_temp.py
      - name: Validate patched pipeline
        run: |
          python -m py_compile scripts/audio_pipeline.py
          python scripts/validate_audio_contracts.py
      - name: Commit canonical patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/audio_pipeline.py
          if git diff --cached --quiet; then
            echo 'No patch changes.'
          else
            git commit -m 'Use audio response type for ElevenLabs TTS'
            git push
          fi
