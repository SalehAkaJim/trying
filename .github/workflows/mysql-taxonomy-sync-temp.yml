name: One-time MySQL taxonomy sync

on:
  push:
    paths:
      - '.github/workflows/mysql-taxonomy-sync-temp.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Synchronize MySQL localization
        run: python scripts/apply_mysql_localization.py
      - name: Commit synchronized MySQL files
        run: |
          git rm .github/workflows/mysql-taxonomy-sync-temp.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add database
          git commit -m 'Synchronize MySQL Persian taxonomy'
          git push
