name: One-shot German Authoring Audio Sync

on:
  push:
    paths:
      - '.github/audio-authoring-sync-once.trigger'

permissions:
  contents: write

concurrency:
  group: one-shot-de-authoring-audio-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Sync Pre-A1 authoring metadata
        run: python scripts/audio_pipeline.py sync-authoring --language de --level Pre-A1
      - name: Sync A1 authoring metadata
        run: python scripts/audio_pipeline.py sync-authoring --language de --level A1
      - name: Validate audio contracts after sync
        run: python scripts/validate_audio_contracts.py
      - name: Commit authoring metadata sync
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A content/de/pre-a1/lessons content/de/a1/lessons content/de/lexemes
          if git diff --cached --quiet; then
            echo 'No authoring audio metadata changes to commit.'
          else
            git commit -m 'Sync German authoring audio metadata'
            git push
          fi
