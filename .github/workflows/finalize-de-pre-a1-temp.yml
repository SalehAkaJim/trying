name: One-time German Pre-A1 finalization

on:
  push:
    paths:
      - 'scripts/finalize_de_pre_a1_temp.py'
      - 'scripts/normalize_activity_transformations_temp.py'
      - '.github/workflows/finalize-de-pre-a1-temp.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Generate final Pre-A1 snapshot
        run: python scripts/finalize_de_pre_a1_temp.py
      - name: Normalize legacy activity transformations
        run: python scripts/normalize_activity_transformations_temp.py
      - name: Synchronize taxonomy into MySQL schema
        run: python scripts/apply_mysql_localization.py
      - name: Install validator
        run: python -m pip install --disable-pip-version-check jsonschema
      - name: Validate JSON schemas
        run: python scripts/validate_json_schemas.py
      - name: Validate project contracts
        run: |
          python scripts/sync_fa_labels.py
          python scripts/validate_source_localization.py
          python scripts/apply_mysql_localization.py --check
          python scripts/validate_project_contracts.py
          python scripts/validate_audio_contracts.py
      - name: Commit validated German Pre-A1 content
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add content config docs schemas scripts database
          if git diff --cached --quiet; then
            echo 'No generated changes.'
          else
            git commit -m 'Finalize source-backed German Pre-A1 content'
            git push
          fi
