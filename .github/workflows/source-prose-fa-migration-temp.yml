name: One-time Persian source prose migration

on:
  push:
    paths:
      - '.github/workflows/source-prose-fa-migration-temp.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Migrate source prose
        run: python scripts/migrate_source_prose_fa.py
      - name: Commit migration
        run: |
          git rm .github/workflows/source-prose-fa-migration-temp.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add content
          git commit -m 'Translate assistant-authored source prose to Persian'
          git push
