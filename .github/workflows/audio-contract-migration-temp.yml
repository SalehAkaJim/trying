name: One-time level-safe audio contract migration

on:
  push:
    paths:
      - '.github/workflows/audio-contract-migration-temp.yml'
      - 'scripts/migrate_audio_contract_temp.py'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply migration
        run: |
          python scripts/migrate_audio_contract_temp.py
          python scripts/apply_mysql_localization.py
          python scripts/sync_fa_labels.py
          python scripts/validate_source_localization.py
          python scripts/validate_project_contracts.py
          python scripts/validate_audio_contracts.py
      - name: Commit migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add config database content schemas scripts docs
          git commit -m "Make audio linking level-safe and stable-keyed"
          git push
