name: Curriculum Audio Pipeline

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Audio pipeline operation
        required: true
        type: choice
        options:
          - plan
          - resolve-voices
          - generate
          - validate-assets
        default: plan
      language:
        description: Language code
        required: true
        type: string
        default: de
      level:
        description: CEFR level
        required: true
        type: string
        default: Pre-A1
      confirm_paid_generation:
        description: Confirm paid ElevenLabs TTS generation
        required: true
        type: boolean
        default: false
  push:
    paths:
      - '.github/workflows/audio-generation.yml'

permissions:
  contents: write

concurrency:
  group: curriculum-audio-${{ github.event_name == 'workflow_dispatch' && inputs.language || 'de' }}-${{ github.event_name == 'workflow_dispatch' && inputs.level || 'Pre-A1' }}
  cancel-in-progress: false

jobs:
  audio:
    runs-on: ubuntu-latest
    env:
      AUDIO_OPERATION: ${{ github.event_name == 'workflow_dispatch' && inputs.operation || 'resolve-voices' }}
      AUDIO_LANGUAGE: ${{ github.event_name == 'workflow_dispatch' && inputs.language || 'de' }}
      AUDIO_LEVEL: ${{ github.event_name == 'workflow_dispatch' && inputs.level || 'Pre-A1' }}
      AUDIO_CONFIRM_PAID: ${{ github.event_name == 'workflow_dispatch' && inputs.confirm_paid_generation || false }}
      ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
      AUDIO_DB_HOST: 127.0.0.1
      AUDIO_DB_PORT: '3306'
      AUDIO_DB_USER: root
      AUDIO_DB_PASSWORD: root
      AUDIO_DB_NAME: language_content_test
      AUDIO_MYSQL_IMAGE: mysql:9.0.1
    services:
      mysql:
        image: mysql:9.0.1
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: language_content_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s --health-timeout=5s --health-retries=12

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install JSON Schema validator
        run: python -m pip install --disable-pip-version-check jsonschema

      - name: Validate project and audio contracts
        run: |
          python scripts/validate_json_schemas.py
          python scripts/sync_fa_labels.py
          python scripts/validate_source_localization.py
          python scripts/validate_persian_coverage.py
          python scripts/apply_mysql_localization.py --check
          python scripts/validate_project_contracts.py
          python scripts/validate_audio_contracts.py

      - name: Build canonical MySQL state
        run: bash scripts/validate_mysql_content.sh

      - name: Plan audio
        if: env.AUDIO_OPERATION == 'plan'
        run: >-
          python scripts/audio_pipeline.py plan
          --language "$AUDIO_LANGUAGE"
          --level "$AUDIO_LEVEL"
          --allow-unresolved-voices

      - name: Require ElevenLabs key
        if: env.AUDIO_OPERATION == 'resolve-voices' || env.AUDIO_OPERATION == 'generate'
        shell: bash
        run: |
          if [ -z "$ELEVENLABS_API_KEY" ]; then
            echo 'Missing GitHub Actions secret ELEVENLABS_API_KEY.' >&2
            exit 2
          fi

      - name: Resolve and lock voices
        if: env.AUDIO_OPERATION == 'resolve-voices' || env.AUDIO_OPERATION == 'generate'
        run: python scripts/audio_pipeline.py resolve-voices --language "$AUDIO_LANGUAGE"

      - name: Rebuild MySQL with voice lock
        if: env.AUDIO_OPERATION == 'resolve-voices' || env.AUDIO_OPERATION == 'generate'
        run: bash scripts/validate_mysql_content.sh

      - name: Verify resolved audio plan
        if: env.AUDIO_OPERATION == 'resolve-voices' || env.AUDIO_OPERATION == 'generate'
        run: >-
          python scripts/audio_pipeline.py plan
          --language "$AUDIO_LANGUAGE"
          --level "$AUDIO_LEVEL"

      - name: Require explicit paid-generation confirmation
        if: env.AUDIO_OPERATION == 'generate'
        shell: bash
        run: |
          if [ "$AUDIO_CONFIRM_PAID" != 'true' ]; then
            echo 'Paid generation was not confirmed.' >&2
            exit 2
          fi

      - name: Generate audio assets
        if: env.AUDIO_OPERATION == 'generate'
        run: >-
          python scripts/audio_pipeline.py generate
          --language "$AUDIO_LANGUAGE"
          --level "$AUDIO_LEVEL"
          --confirm-paid-generation

      - name: Validate generated assets
        if: env.AUDIO_OPERATION == 'generate' || env.AUDIO_OPERATION == 'validate-assets'
        run: >-
          python scripts/audio_pipeline.py validate-assets
          --language "$AUDIO_LANGUAGE"
          --level "$AUDIO_LEVEL"

      - name: Validate generated mapping on MySQL 9.0.1
        if: env.AUDIO_OPERATION == 'generate'
        run: |
          bash scripts/validate_mysql_content.sh
          python scripts/audio_pipeline.py plan --language "$AUDIO_LANGUAGE" --level "$AUDIO_LEVEL" > /tmp/audio-plan-summary.json
          python - <<'PY'
          import json
          data=json.load(open('/tmp/audio-plan-summary.json',encoding='utf-8'))
          if data['needsGeneration'] != 0 or data['unresolvedVoices'] != 0:
              raise SystemExit(f"Generated audio is not fully current: {data}")
          print('Generated audio is fully current in MySQL.')
          PY

      - name: Commit resolved voices or generated assets
        if: env.AUDIO_OPERATION == 'resolve-voices' || env.AUDIO_OPERATION == 'generate'
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for path in config/audio-voice-locks database/audio audio; do
            if [ -e "$path" ]; then git add -A "$path"; fi
          done
          if git diff --cached --quiet; then
            echo 'No audio changes to commit.'
          else
            git commit -m "Audio $AUDIO_OPERATION: $AUDIO_LANGUAGE $AUDIO_LEVEL"
            git push
          fi
