name: One-time German Pre-A1 simple choice extension

on:
  push:
    paths:
      - 'scripts/extend_pre_a1_choice_temp.py'
      - '.github/workflows/pre-a1-choice-temp.yml'

permissions:
  contents: write

jobs:
  extend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build lesson snapshot
        run: python scripts/extend_pre_a1_choice_temp.py
      - name: Validate authoring contracts
        run: |
          python scripts/sync_fa_labels.py
          python scripts/validate_source_localization.py
          python scripts/apply_mysql_localization.py --check
          python scripts/validate_project_contracts.py
          python scripts/validate_audio_contracts.py
      - name: Commit generated content
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content database/content
          git commit -m "Add source-backed simple choice lesson to German Pre-A1"
          git push
