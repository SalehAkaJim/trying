name: MySQL 9.0.1 Database

on:
  push:
    paths:
      - 'database/schema.sql'
      - 'database/content/**'
      - 'content/**'
      - 'schemas/activity.schema.json'
      - '.github/workflows/mysql-schema.yml'
  pull_request:
    paths:
      - 'database/schema.sql'
      - 'database/content/**'
      - 'content/**'
      - 'schemas/activity.schema.json'
      - '.github/workflows/mysql-schema.yml'

jobs:
  validate-database:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:9.0.1
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: language_content_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    steps:
      - uses: actions/checkout@v4

      - name: Verify image-free learner content
        run: |
          python - <<'PY'
          import json
          import pathlib
          import re
          import sys

          forbidden = {
              'image', 'imageurl', 'imageref', 'picture', 'photo',
              'illustration', 'thumbnail', 'thumbnailurl', 'thumbnailref'
          }

          def normalized_key(key: str) -> str:
              return re.sub(r'[_\-\s]', '', key).lower()

          errors = []

          for path in pathlib.Path('content').rglob('*.json'):
              data = json.loads(path.read_text(encoding='utf-8'))

              def walk(value, location='$'):
                  if isinstance(value, dict):
                      for key, child in value.items():
                          if normalized_key(str(key)) in forbidden:
                              errors.append(f'{path}:{location}.{key}: forbidden image-bearing field')
                          walk(child, f'{location}.{key}')
                  elif isinstance(value, list):
                      for index, child in enumerate(value):
                          walk(child, f'{location}[{index}]')

              walk(data)

          sql_key_pattern = re.compile(
              r"['\"`](?:image(?:_?url|_?ref)?|picture|photo|illustration|thumbnail(?:_?url|_?ref)?)['\"`]\s*(?:[,):=])",
              re.IGNORECASE,
          )
          for path in pathlib.Path('database/content').rglob('*.sql'):
              text = path.read_text(encoding='utf-8')
              for match in sql_key_pattern.finditer(text):
                  line = text.count('\n', 0, match.start()) + 1
                  errors.append(f'{path}:{line}: forbidden image-bearing SQL/JSON field {match.group(0)!r}')

          if errors:
              print('\n'.join(errors))
              sys.exit(1)

          print('Image-free learner-content structural check passed.')
          PY

      - name: Verify activity schema JSON
        run: python -m json.tool schemas/activity.schema.json > /dev/null

      - name: Verify MySQL server version
        run: |
          version="$(docker run --rm --network host mysql:9.0.1 \
            mysql -N -s -h127.0.0.1 -uroot -proot \
            -e "SELECT VERSION();" | tr -d '\r[:space:]')"
          echo "MySQL version: $version"
          test "$version" = "9.0.1"

      - name: Apply schema on MySQL 9.0.1
        run: |
          docker run --rm -i --network host mysql:9.0.1 \
            mysql -h127.0.0.1 -uroot -proot language_content_test \
            < database/schema.sql

      - name: Apply schema a second time
        run: |
          docker run --rm -i --network host mysql:9.0.1 \
            mysql -h127.0.0.1 -uroot -proot language_content_test \
            < database/schema.sql

      - name: Verify core tables and views
        run: |
          docker run --rm --network host mysql:9.0.1 \
            mysql -h127.0.0.1 -uroot -proot language_content_test \
            -e "
              SELECT 1 FROM languages LIMIT 0;
              SELECT 1 FROM language_levels LIMIT 0;
              SELECT 1 FROM units LIMIT 0;
              SELECT 1 FROM lessons LIMIT 0;
              SELECT 1 FROM activities LIMIT 0;
              SELECT 1 FROM dialogues LIMIT 0;
              SELECT 1 FROM dialogue_turns LIMIT 0;
              SELECT 1 FROM sources LIMIT 0;
              SELECT 1 FROM source_items LIMIT 0;
              SELECT 1 FROM lexemes LIMIT 0;
              SELECT 1 FROM lexeme_forms LIMIT 0;
              SELECT 1 FROM lexeme_occurrences LIMIT 0;
              SELECT 1 FROM v_learner_facing_source_items LIMIT 0;
              SELECT 1 FROM v_lexeme_surface_candidates LIMIT 0;
              SELECT 1 FROM v_language_level_structure_counts LIMIT 0;
              SELECT 1 FROM v_invalid_learner_facing_source_links LIMIT 0;
            "

      - name: Verify required triggers
        run: |
          trigger_count="$(docker run --rm --network host mysql:9.0.1 \
            mysql -N -s -h127.0.0.1 -uroot -proot language_content_test \
            -e "SELECT COUNT(*) FROM information_schema.triggers WHERE trigger_schema='language_content_test' AND trigger_name IN ('trg_lexeme_occurrences_bi','trg_lexeme_occurrences_bu','trg_lessons_bi_final_guard','trg_lessons_bu_final_guard','trg_activities_bi_final_guard','trg_activities_bd_final_guard','trg_activities_bu_final_guard');" \
            | tr -d '\r[:space:]')"
          echo "Required trigger count: $trigger_count"
          test "$trigger_count" = "7"

      - name: Apply German Pre-A1 content
        run: |
          docker run --rm -i --network host mysql:9.0.1 \
            mysql -h127.0.0.1 -uroot -proot language_content_test \
            < database/content/de/pre-a1.sql

      - name: Reapply German Pre-A1 content and verify idempotency
        run: |
          before="$(docker run --rm --network host mysql:9.0.1 \
            mysql -N -s -h127.0.0.1 -uroot -proot language_content_test \
            -e "SELECT CONCAT_WS(':',
              (SELECT COUNT(*) FROM languages),
              (SELECT COUNT(*) FROM language_levels),
              (SELECT COUNT(*) FROM curriculum_targets),
              (SELECT COUNT(*) FROM sources),
              (SELECT COUNT(*) FROM source_items),
              (SELECT COUNT(*) FROM characters),
              (SELECT COUNT(*) FROM units),
              (SELECT COUNT(*) FROM lessons),
              (SELECT COUNT(*) FROM dialogues),
              (SELECT COUNT(*) FROM dialogue_turns),
              (SELECT COUNT(*) FROM activities),
              (SELECT COUNT(*) FROM lexemes),
              (SELECT COUNT(*) FROM lexeme_forms),
              (SELECT COUNT(*) FROM lexeme_occurrences),
              (SELECT COUNT(*) FROM provenance_links)
            );" | tr -d '\r[:space:]')"

          docker run --rm -i --network host mysql:9.0.1 \
            mysql -h127.0.0.1 -uroot -proot language_content_test \
            < database/content/de/pre-a1.sql

          after="$(docker run --rm --network host mysql:9.0.1 \
            mysql -N -s -h127.0.0.1 -uroot -proot language_content_test \
            -e "SELECT CONCAT_WS(':',
              (SELECT COUNT(*) FROM languages),
              (SELECT COUNT(*) FROM language_levels),
              (SELECT COUNT(*) FROM curriculum_targets),
              (SELECT COUNT(*) FROM sources),
              (SELECT COUNT(*) FROM source_items),
              (SELECT COUNT(*) FROM characters),
              (SELECT COUNT(*) FROM units),
              (SELECT COUNT(*) FROM lessons),
              (SELECT COUNT(*) FROM dialogues),
              (SELECT COUNT(*) FROM dialogue_turns),
              (SELECT COUNT(*) FROM activities),
              (SELECT COUNT(*) FROM lexemes),
              (SELECT COUNT(*) FROM lexeme_forms),
              (SELECT COUNT(*) FROM lexeme_occurrences),
              (SELECT COUNT(*) FROM provenance_links)
            );" | tr -d '\r[:space:]')"

          echo "Before second import: $before"
          echo "After second import:  $after"
          test "$before" = "$after"

      - name: Verify German Pre-A1 baseline
        run: |
          lesson_count="$(docker run --rm --network host mysql:9.0.1 \
            mysql -N -s -h127.0.0.1 -uroot -proot language_content_test \
            -e "SELECT COUNT(*) FROM lessons l JOIN language_levels ll ON ll.id=l.language_level_id JOIN languages lang ON lang.id=ll.language_id WHERE lang.code='de' AND ll.cefr_level='Pre-A1';" | tr -d '\r[:space:]')"
          opening_count="$(docker run --rm --network host mysql:9.0.1 \
            mysql -N -s -h127.0.0.1 -uroot -proot language_content_test \
            -e "SELECT COUNT(DISTINCT l.id) FROM lessons l JOIN language_levels ll ON ll.id=l.language_level_id JOIN languages lang ON lang.id=ll.language_id JOIN activities a ON a.lesson_id=l.id WHERE lang.code='de' AND ll.cefr_level='Pre-A1' AND a.position_index=1 AND a.activity_type='conversation_speaking';" | tr -d '\r[:space:]')"
          form_count="$(docker run --rm --network host mysql:9.0.1 \
            mysql -N -s -h127.0.0.1 -uroot -proot language_content_test \
            -e "SELECT COUNT(*) FROM lexeme_forms lf JOIN lexemes l ON l.id=lf.lexeme_id WHERE l.lexeme_key='lex-de-moegen' AND lf.lexeme_form_key IN ('lexform-de-moegen-mag','lexform-de-moegen-magst') AND lf.review_status='approved';" | tr -d '\r[:space:]')"
          invalid_source_count="$(docker run --rm --network host mysql:9.0.1 \
            mysql -N -s -h127.0.0.1 -uroot -proot language_content_test \
            -e "SELECT COUNT(*) FROM v_invalid_learner_facing_source_links;" | tr -d '\r[:space:]')"

          echo "German Pre-A1 lessons: $lesson_count"
          echo "Lessons with required opening conversation: $opening_count"
          echo "Approved mögen forms: $form_count"
          echo "Invalid learner-facing source links: $invalid_source_count"

          test "$lesson_count" -gt 0
          test "$opening_count" = "$lesson_count"
          test "$form_count" = "2"
          test "$invalid_source_count" = "0"
