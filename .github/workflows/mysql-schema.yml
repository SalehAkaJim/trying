name: MySQL 9.0.1 Schema

on:
  push:
    paths:
      - 'database/schema.sql'
      - '.github/workflows/mysql-schema.yml'
  pull_request:
    paths:
      - 'database/schema.sql'
      - '.github/workflows/mysql-schema.yml'

jobs:
  validate-schema:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:9.0.1
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: language_content_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    steps:
      - uses: actions/checkout@v4

      - name: Verify MySQL server version
        run: |
          version="$(docker run --rm --network host mysql:9.0.1 \
            mysql -N -s -h127.0.0.1 -uroot -proot \
            -e "SELECT VERSION();" | tr -d '\r[:space:]')"
          echo "MySQL version: $version"
          test "$version" = "9.0.1"

      - name: Apply schema on MySQL 9.0.1
        run: |
          docker run --rm -i --network host mysql:9.0.1 \
            mysql -h127.0.0.1 -uroot -proot language_content_test \
            < database/schema.sql

      - name: Apply schema a second time
        run: |
          docker run --rm -i --network host mysql:9.0.1 \
            mysql -h127.0.0.1 -uroot -proot language_content_test \
            < database/schema.sql

      - name: Verify core tables and views
        run: |
          docker run --rm --network host mysql:9.0.1 \
            mysql -h127.0.0.1 -uroot -proot language_content_test \
            -e "
              SELECT 1 FROM languages LIMIT 0;
              SELECT 1 FROM language_levels LIMIT 0;
              SELECT 1 FROM units LIMIT 0;
              SELECT 1 FROM lessons LIMIT 0;
              SELECT 1 FROM activities LIMIT 0;
              SELECT 1 FROM dialogues LIMIT 0;
              SELECT 1 FROM dialogue_turns LIMIT 0;
              SELECT 1 FROM sources LIMIT 0;
              SELECT 1 FROM source_items LIMIT 0;
              SELECT 1 FROM lexemes LIMIT 0;
              SELECT 1 FROM lexeme_forms LIMIT 0;
              SELECT 1 FROM lexeme_occurrences LIMIT 0;
              SELECT 1 FROM v_learner_facing_source_items LIMIT 0;
              SELECT 1 FROM v_lexeme_surface_candidates LIMIT 0;
              SELECT 1 FROM v_language_level_structure_counts LIMIT 0;
              SELECT 1 FROM v_invalid_learner_facing_source_links LIMIT 0;
            "

      - name: Verify required triggers
        run: |
          trigger_count="$(docker run --rm --network host mysql:9.0.1 \
            mysql -N -s -h127.0.0.1 -uroot -proot language_content_test \
            -e "SELECT COUNT(*) FROM information_schema.triggers WHERE trigger_schema='language_content_test' AND trigger_name IN ('trg_lexeme_occurrences_bi','trg_lexeme_occurrences_bu','trg_lessons_bi_final_guard','trg_lessons_bu_final_guard','trg_activities_bi_final_guard','trg_activities_bd_final_guard','trg_activities_bu_final_guard');" \
            | tr -d '\r[:space:]')"
          echo "Required trigger count: $trigger_count"
          test "$trigger_count" = "7"
