name: MySQL 9.0.1 Database

on:
  push:
    paths:
      - 'database/**'
      - 'content/**'
      - 'config/**'
      - 'schemas/**'
      - 'scripts/**'
      - 'docs/**'
      - '.github/workflows/mysql-schema.yml'
      - '.github/workflows/audio-generation.yml'
  pull_request:
    paths:
      - 'database/**'
      - 'content/**'
      - 'config/**'
      - 'schemas/**'
      - 'scripts/**'
      - 'docs/**'
      - '.github/workflows/mysql-schema.yml'
      - '.github/workflows/audio-generation.yml'

jobs:
  validate-database:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:9.0.1
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: language_content_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s --health-timeout=5s --health-retries=12

    steps:
      - uses: actions/checkout@v4

      - name: Validate shared project contracts
        run: |
          python scripts/sync_fa_labels.py
          python scripts/validate_source_localization.py
          python scripts/validate_persian_coverage.py
          python scripts/apply_mysql_localization.py --check
          python scripts/audit_dynamic_structure.py
          python scripts/validate_project_contracts.py
          python scripts/validate_audio_contracts.py

      - name: Validate every language and level on MySQL 9.0.1
        run: bash scripts/validate_mysql_content.sh

      - name: Validate matching pair bounds in MySQL
        run: bash scripts/validate_mysql_matching_bounds.sh

      - name: Dry-run audio plan for every final level
        shell: bash
        run: |
          python - <<'PY' > /tmp/final_audio_levels.tsv
          import json, pathlib
          rows=[]
          for path in pathlib.Path('content').glob('*/*/level.json'):
              data=json.loads(path.read_text(encoding='utf-8'))
              if data.get('status')=='final':
                  rows.append((data['languageId'], data['level']))
          for language, level in sorted(rows):
              print(f'{language}\t{level}')
          PY
          while IFS=$'\t' read -r language level; do
            [ -n "$language" ] || continue
            echo "Planning audio for $language $level"
            python scripts/audio_pipeline.py plan --language "$language" --level "$level" --allow-unresolved-voices
            python scripts/sync_audio_level_status.py --language "$language" --level "$level" --check
          done < /tmp/final_audio_levels.tsv
