name: One-off German Pre-A1 audio state repair

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/audio-state-repair-once.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Repair generated audio state and harden pipeline
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one match, got {count}")
              return text.replace(old, new, 1)

          pipeline_path = Path("scripts/audio_pipeline.py")
          pipeline = pipeline_path.read_text(encoding="utf-8")
          old_reused = '''                **item,
                "path": path.relative_to(ROOT).as_posix(),
                "publicUrl": public_url_for(path, config),
                "audioSha256": sha256_file(path),
                "byteSize": path.stat().st_size,
                "reused": True,
'''
          new_reused = '''                **item,
                "audioStatus": "ready",
                "audioUrl": public_url_for(path, config),
                "audioStoragePath": path.relative_to(ROOT).as_posix(),
                "audioIsCurrent": True,
                "needsGeneration": False,
                "path": path.relative_to(ROOT).as_posix(),
                "publicUrl": public_url_for(path, config),
                "audioSha256": sha256_file(path),
                "byteSize": path.stat().st_size,
                "reused": True,
'''
          pipeline = replace_once(pipeline, old_reused, new_reused, "reused asset normalization")
          old_generated = '''            **item,
            "path": path.relative_to(ROOT).as_posix(),
            "publicUrl": public_url_for(path, config),
            "audioSha256": sha256_file(path),
            "byteSize": path.stat().st_size,
            "reused": False,
'''
          new_generated = '''            **item,
            "audioStatus": "ready",
            "audioUrl": public_url_for(path, config),
            "audioStoragePath": path.relative_to(ROOT).as_posix(),
            "audioIsCurrent": True,
            "needsGeneration": False,
            "path": path.relative_to(ROOT).as_posix(),
            "publicUrl": public_url_for(path, config),
            "audioSha256": sha256_file(path),
            "byteSize": path.stat().st_size,
            "reused": False,
'''
          pipeline = replace_once(pipeline, old_generated, new_generated, "new asset normalization")
          pipeline = replace_once(pipeline, '''    asset_manifest = {
''', '''    invalid_generated_state = [
        a["ownerKey"] for a in assets
        if a.get("audioStatus") != "ready"
        or a.get("audioIsCurrent") is not True
        or a.get("needsGeneration") is not False
        or a.get("audioUrl") != a.get("publicUrl")
        or a.get("audioStoragePath") != a.get("path")
    ]
    if invalid_generated_state:
        raise RuntimeError(
            "Refusing to write audio mapping with non-current generated assets: "
            + ", ".join(invalid_generated_state[:10])
        )

    asset_manifest = {
''', "mapping safety gate")
          pipeline = replace_once(pipeline, '''    data = load_json(manifest_path)
    errors = []
    seen = set()
    for asset in data.get("assets") or []:
''', '''    data = load_json(manifest_path)
    errors = []
    assets = data.get("assets") or []
    if data.get("assetCount") != len(assets):
        errors.append(f"manifest assetCount mismatch: declared={data.get('assetCount')} actual={len(assets)}")
    seen = set()
    for asset in assets:
''', "manifest count validation")
          pipeline = replace_once(pipeline, '''        if not asset.get("voiceId") or not asset.get("voiceName"):
            errors.append(f"missing voice assignment: {asset.get('ownerKey')}")
''', '''        if not asset.get("voiceId") or not asset.get("voiceName"):
            errors.append(f"missing voice assignment: {asset.get('ownerKey')}")
        if asset.get("audioStatus") != "ready":
            errors.append(f"generated asset is not ready: {asset.get('ownerKey')}")
        if asset.get("audioIsCurrent") is not True:
            errors.append(f"generated asset is not current: {asset.get('ownerKey')}")
        if asset.get("needsGeneration") is not False:
            errors.append(f"generated asset still requests generation: {asset.get('ownerKey')}")
        if asset.get("audioUrl") != asset.get("publicUrl"):
            errors.append(f"audioUrl/publicUrl mismatch: {asset.get('ownerKey')}")
        if asset.get("audioStoragePath") != asset.get("path"):
            errors.append(f"audioStoragePath/path mismatch: {asset.get('ownerKey')}")
''', "generated state validation")
          pipeline_path.write_text(pipeline, encoding="utf-8")

          manifest_path = Path("audio/de/pre-a1/manifest.json")
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          lock = json.loads(Path("config/audio-voice-locks/de.json").read_text(encoding="utf-8"))
          assets = manifest.get("assets") or []
          if manifest.get("assetCount") != len(assets) or len(assets) != 104:
              raise SystemExit(f"unexpected Pre-A1 manifest size: {manifest.get('assetCount')} / {len(assets)}")
          stale_before = 0
          for asset in assets:
              owner = asset.get("ownerKey")
              rel = asset.get("path")
              path = Path(rel or "")
              if not rel or not path.is_file():
                  raise SystemExit(f"missing generated file for {owner}: {rel}")
              if hashlib.sha256(path.read_bytes()).hexdigest() != asset.get("audioSha256"):
                  raise SystemExit(f"file hash mismatch for {owner}")
              if hashlib.sha256((asset.get("audioText") or "").encode("utf-8")).hexdigest() != asset.get("expectedSourceHash"):
                  raise SystemExit(f"source hash mismatch for {owner}")
              assignment = asset.get("voiceAssignmentKey")
              expected_voice = lock.get("standalone") if assignment == "standalone" else (lock.get("characters") or {}).get(assignment)
              if not expected_voice:
                  raise SystemExit(f"no current voice lock for {owner}: {assignment}")
              if asset.get("voiceId") != expected_voice.get("voiceId") or asset.get("voiceName") != expected_voice.get("voiceName"):
                  raise SystemExit(f"voice lock mismatch for {owner}")
              is_current = asset.get("audioStatus") == "ready" and asset.get("audioIsCurrent") is True and asset.get("needsGeneration") is False
              if not is_current:
                  stale_before += 1
                  if asset.get("reused") is not False:
                      raise SystemExit(f"refusing metadata-only repair for non-fresh stale asset {owner}")
              asset["audioStatus"] = "ready"
              asset["audioUrl"] = asset.get("publicUrl")
              asset["audioStoragePath"] = asset.get("path")
              asset["audioIsCurrent"] = True
              asset["needsGeneration"] = False
          if stale_before != 48:
              raise SystemExit(f"expected 48 stale records from the known generator bug, found {stale_before}")
          manifest_path.write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")

          level_path = Path("content/de/pre-a1/level.json")
          level = json.loads(level_path.read_text(encoding="utf-8"))
          level["audioStatus"] = "ready"
          level["notes"] = "سطح پیش از A1 آلمانی از نظر محتوای آموزشی در دامنه فعلی متن/صوت و بدون تصویر نهایی شده است؛ هر ۱۰۴ دارایی صوتی موردنیاز تولید، لینک و اعتبارسنجی شده‌اند."
          quality = ((level.get("completionAssessment") or {}).get("qualityReview") or {})
          quality["remainingWeaknesses"] = [item for item in (quality.get("remainingWeaknesses") or []) if "صوت" not in item and "audio" not in item.lower()]
          level_path.write_text(json.dumps(level, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")

          validator_path = Path("scripts/validate_audio_contracts.py")
          validator = validator_path.read_text(encoding="utf-8")
          validator = replace_once(validator, "import json\n", "import hashlib\nimport json\n", "validator hashlib import")
          marker = '''if errors:
    print("Audio contract validation failed:")
'''
          checks = '''# Committed generated manifests are release artifacts. They must be physically
# valid, current, and aligned with the current canonical voice lock.
def _audio_file_sha256(path: Path) -> str:
    h = hashlib.sha256()
    with path.open("rb") as f:
        for chunk in iter(lambda: f.read(1024 * 1024), b""):
            h.update(chunk)
    return h.hexdigest()

for manifest_path in Path("audio").glob("*/*/manifest.json"):
    try:
        manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
    except Exception as exc:
        errors.append(f"{manifest_path}: invalid manifest JSON: {exc}")
        continue
    assets = manifest.get("assets") or []
    if manifest.get("assetCount") != len(assets):
        errors.append(f"{manifest_path}: assetCount does not match assets length")
    language = manifest.get("language")
    lock_path = Path("config/audio-voice-locks") / f"{language}.json"
    lock = json.loads(lock_path.read_text(encoding="utf-8")) if lock_path.exists() else None
    if not lock:
        errors.append(f"{manifest_path}: missing canonical voice lock {lock_path}")
        continue
    for asset in assets:
        owner = asset.get("ownerKey")
        rel = asset.get("path")
        p = Path(str(rel or ""))
        if not rel or not p.is_file():
            errors.append(f"{manifest_path}:{owner}: missing generated audio file {rel!r}")
        else:
            if _audio_file_sha256(p) != asset.get("audioSha256"):
                errors.append(f"{manifest_path}:{owner}: generated audio SHA mismatch")
            if p.stat().st_size != asset.get("byteSize"):
                errors.append(f"{manifest_path}:{owner}: generated audio byte size mismatch")
        expected_text_hash = hashlib.sha256(str(asset.get("audioText") or "").encode("utf-8")).hexdigest()
        if expected_text_hash != asset.get("expectedSourceHash"):
            errors.append(f"{manifest_path}:{owner}: source text hash mismatch")
        if asset.get("audioStatus") != "ready" or asset.get("audioIsCurrent") is not True or asset.get("needsGeneration") is not False:
            errors.append(f"{manifest_path}:{owner}: committed generated asset is not ready/current")
        if asset.get("audioUrl") != asset.get("publicUrl") or asset.get("audioStoragePath") != asset.get("path"):
            errors.append(f"{manifest_path}:{owner}: generated URL/storage metadata is inconsistent")
        assignment = asset.get("voiceAssignmentKey")
        expected_voice = lock.get("standalone") if assignment == "standalone" else (lock.get("characters") or {}).get(assignment)
        if not expected_voice:
            errors.append(f"{manifest_path}:{owner}: no canonical voice for {assignment!r}")
        elif asset.get("voiceId") != expected_voice.get("voiceId") or asset.get("voiceName") != expected_voice.get("voiceName"):
            errors.append(f"{manifest_path}:{owner}: generated voice does not match canonical voice lock")

if errors:
    print("Audio contract validation failed:")
'''
          validator = replace_once(validator, marker, checks, "committed manifest contract checks")
          validator_path.write_text(validator, encoding="utf-8")

          mapping = Path("database/audio/de/pre-a1.sql").read_text(encoding="utf-8")
          missing_mapping = [a["ownerKey"] for a in assets if a["ownerKey"] not in mapping]
          if missing_mapping:
              raise SystemExit("mapping SQL is missing assets: " + ", ".join(missing_mapping[:10]))
          print(f"Repaired {stale_before} falsely-stale records; {len(assets)} assets are now ready/current.")
          PY

      - name: Validate repaired audio contracts
        shell: bash
        run: |
          python3 scripts/audio_pipeline.py validate-assets --language de --level Pre-A1
          python3 scripts/validate_audio_contracts.py
          python3 scripts/validate_json_schemas.py
          python3 scripts/validate_persian_coverage.py

      - name: Commit repair
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/audio_pipeline.py scripts/validate_audio_contracts.py audio/de/pre-a1/manifest.json content/de/pre-a1/level.json
          if git diff --cached --quiet; then
            echo 'No repair changes to commit.'
            exit 0
          fi
          git commit -m 'Fix generated audio state tracking'
          git push origin HEAD:main
