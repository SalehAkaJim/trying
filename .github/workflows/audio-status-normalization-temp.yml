name: One-time activity audio status normalization

on:
  push:
    paths:
      - '.github/workflows/audio-status-normalization-temp.yml'
      - 'scripts/normalize_activity_audio_temp.py'

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Normalize activity audio requirements
        run: |
          python scripts/normalize_activity_audio_temp.py
          python scripts/validate_project_contracts.py
          python scripts/validate_audio_contracts.py
      - name: Commit normalization
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content database/content scripts
          git commit -m "Separate activity audio from dialogue turn audio"
          git push
