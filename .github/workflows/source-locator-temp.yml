name: One-time source locator schema fix

on:
  push:
    paths:
      - 'scripts/fix_source_locator_temp.py'
      - '.github/workflows/source-locator-temp.yml'

permissions:
  contents: write

jobs:
  fix-and-validate:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:9.0.1
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: language_content_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s --health-timeout=5s --health-retries=12
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply schema fix
        run: python scripts/fix_source_locator_temp.py
      - name: Validate contracts
        run: |
          python scripts/sync_fa_labels.py
          python scripts/validate_source_localization.py
          python scripts/validate_persian_coverage.py
          python scripts/apply_mysql_localization.py --check
          python scripts/validate_project_contracts.py
          python scripts/validate_audio_contracts.py
      - name: Validate MySQL 9.0.1
        run: bash scripts/validate_mysql_content.sh
      - name: Commit fixes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add database/schema.sql content/de/pre-a1/level.json
          if git diff --cached --quiet; then
            echo 'No changes.'
          else
            git commit -m 'Fix source localization columns in MySQL schema'
            git push
          fi
