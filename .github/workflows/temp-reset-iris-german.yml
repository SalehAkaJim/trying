name: Temporary Iris German Voice Reset

on:
  push:
    branches:
      - main
    paths:
      - .github/iris-voice-reset-trigger

permissions:
  contents: write

concurrency:
  group: temp-iris-german-voice-reset
  cancel-in-progress: false

jobs:
  reset:
    runs-on: ubuntu-latest
    env:
      ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
      AUDIO_DB_HOST: 127.0.0.1
      AUDIO_DB_PORT: '3306'
      AUDIO_DB_USER: root
      AUDIO_DB_PASSWORD: root
      AUDIO_DB_NAME: language_content_test
      AUDIO_MYSQL_IMAGE: mysql:9.0.1
    services:
      mysql:
        image: mysql:9.0.1
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: language_content_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s --health-timeout=5s --health-retries=12

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install JSON Schema validator
        run: python -m pip install --disable-pip-version-check jsonschema

      - name: Require ElevenLabs key
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ELEVENLABS_API_KEY"

      - name: Validate clean baseline
        shell: bash
        run: |
          set -euo pipefail
          python scripts/validate_json_schemas.py
          python scripts/sync_fa_labels.py
          python scripts/validate_source_localization.py
          python scripts/validate_persian_coverage.py
          python scripts/apply_mysql_localization.py --check
          python scripts/validate_project_contracts.py
          python scripts/validate_audio_contracts.py
          bash scripts/validate_mysql_content.sh
          python scripts/audio_pipeline.py plan --language de --level Pre-A1 > /tmp/baseline.json
          cat /tmp/baseline.json
          python - <<'PY'
          import json
          p=json.load(open('/tmp/baseline.json', encoding='utf-8'))
          expected={'totalRequired':149,'currentAssets':149,'needsGeneration':0,'unresolvedVoices':0,'voiceLockPresent':True}
          bad={k:(p.get(k),v) for k,v in expected.items() if p.get(k)!=v}
          if bad:
              raise SystemExit(f'Baseline audio is not clean; refusing paid work: {bad}; plan={p}')
          PY

      - name: Select new German-accent voice for Iris
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          from scripts.audio_pipeline import fetch_all_voices

          root=Path('.')
          config=json.loads((root/'config/audio-pipeline.json').read_text(encoding='utf-8'))
          lock=json.loads((root/'config/audio-voice-locks/de.json').read_text(encoding='utf-8'))
          voices=fetch_all_voices(config, os.environ['ELEVENLABS_API_KEY'])
          key='char-de-iris'
          old=(lock.get('characters') or {}).get(key,{}).get('voiceId')
          used={rec.get('voiceId') for k,rec in (lock.get('characters') or {}).items() if k != key and rec.get('voiceId')}
          used.add((lock.get('standalone') or {}).get('voiceId'))
          if old: used.add(old)

          def text(v):
              return str(v or '').strip().lower()

          def german_evidence(v):
              labels=v.get('labels') or {}
              label_lang=text(labels.get('language'))
              label_acc=text(labels.get('accent'))
              if label_lang in {'de','german','deutsch'} or label_lang.startswith('de-'):
                  if 'german' in label_acc or 'deutsch' in label_acc or label_acc in {'de','de-standard','standard'} or label_acc.startswith('de-'):
                      return True
              for item in v.get('verified_languages') or []:
                  code=text(item.get('language'))
                  locale=text(item.get('locale'))
                  accent=text(item.get('accent'))
                  if code=='de' or locale.startswith('de-'):
                      if locale.startswith('de-') or 'german' in accent or 'deutsch' in accent or accent in {'de','de-standard','standard'} or accent.startswith('de-'):
                          return True
              return False

          def score(v):
              labels=v.get('labels') or {}
              s=0
              age=text(labels.get('age'))
              if age in {'young','young adult','young_adult'}: s+=30
              if text(v.get('category')) == 'professional': s+=15
              if text(v.get('recording_quality')) == 'studio': s+=10
              desc=' '.join([text(v.get('description')), text(labels.get('description')), text(labels.get('descriptive')), text(labels.get('use_case'))])
              for token in ('clear','friendly','warm','natural','conversational','calm'):
                  if token in desc: s+=4
              for item in v.get('verified_languages') or []:
                  code=text(item.get('language')); locale=text(item.get('locale')); accent=text(item.get('accent'))
                  if code=='de' or locale.startswith('de-'):
                      s+=25
                      if locale=='de-de': s+=15
                      if 'german' in accent or 'deutsch' in accent or accent.startswith('de-'): s+=15
              return s

          candidates=[]
          for v in voices:
              if not v.get('voice_id') or not v.get('name'): continue
              if v['voice_id'] in used: continue
              labels=v.get('labels') or {}
              if text(labels.get('gender')) != 'female': continue
              if not german_evidence(v): continue
              candidates.append(v)
          if not candidates:
              raise SystemExit('No unused female ElevenLabs voice with explicit German evidence is available for Iris.')
          candidates.sort(key=lambda v:(-score(v), text(v.get('name')), v['voice_id']))
          chosen=candidates[0]

          path=root/'content/de/characters/iris.json'
          data=json.loads(path.read_text(encoding='utf-8'))
          profile=data.setdefault('voiceProfile',{})
          profile['elevenLabsVoiceId']=chosen['voice_id']
          profile['voiceName']=chosen['name']
          path.write_text(json.dumps(data, ensure_ascii=False, indent=2)+'\n', encoding='utf-8')

          report={
              'voiceId':chosen['voice_id'],
              'voiceName':chosen['name'],
              'labels':chosen.get('labels') or {},
              'verifiedGerman':[x for x in (chosen.get('verified_languages') or []) if text(x.get('language'))=='de' or text(x.get('locale')).startswith('de-')],
              'score':score(chosen),
              'oldVoiceId':old,
          }
          print(json.dumps(report,ensure_ascii=False,indent=2))
          Path('/tmp/selected-iris-voice.json').write_text(json.dumps(report,ensure_ascii=False,indent=2),encoding='utf-8')
          PY

      - name: Resolve and verify Iris voice
        shell: bash
        run: |
          set -euo pipefail
          python scripts/audio_pipeline.py resolve-voices --language de
          python - <<'PY'
          import json
          selected=json.load(open('/tmp/selected-iris-voice.json',encoding='utf-8'))
          lock=json.load(open('config/audio-voice-locks/de.json',encoding='utf-8'))
          rec=lock['characters']['char-de-iris']
          if rec['voiceId'] != selected['voiceId']:
              raise SystemExit(f'Voice lock drift for Iris: {rec["voiceId"]} != {selected["voiceId"]}')
          verified=rec.get('providerMetadata',{}).get('verifiedLanguages') or []
          good=False
          for item in verified:
              code=str(item.get('language') or '').lower()
              locale=str(item.get('locale') or '').lower()
              accent=str(item.get('accent') or '').lower()
              if code=='de' or locale.startswith('de-'):
                  if locale.startswith('de-') or 'german' in accent or 'deutsch' in accent or accent in {'de','de-standard','standard'} or accent.startswith('de-'):
                      good=True
          labels=rec.get('providerMetadata',{}).get('labels') or {}
          label_lang=str(labels.get('language') or '').lower()
          label_acc=str(labels.get('accent') or '').lower()
          if (label_lang in {'de','german','deutsch'} or label_lang.startswith('de-')) and ('german' in label_acc or 'deutsch' in label_acc or label_acc in {'de','de-standard','standard'} or label_acc.startswith('de-')):
              good=True
          if not good:
              raise SystemExit(f'Selected Iris voice lost German evidence: {rec}')
          print('Selected Iris voice has explicit German language/accent evidence.')
          PY

      - name: Delete every existing Iris dialogue-turn asset
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          manifest=json.load(open('audio/de/pre-a1/manifest.json',encoding='utf-8'))
          assets=[a for a in manifest.get('assets',[]) if a.get('voiceAssignmentKey')=='char-de-iris']
          if not assets:
              raise SystemExit('No Iris audio assets found to rebuild.')
          owners=[]
          for a in assets:
              if a.get('ownerType')!='dialogue_turn':
                  raise SystemExit(f'Unexpected Iris asset type: {a}')
              owner=a['ownerKey']
              path=Path('audio/de/pre-a1/dialogue_turn')/f'{owner}.mp3'
              if not path.exists():
                  raise SystemExit(f'Iris asset was already missing before reset: {path}')
              path.unlink()
              owners.append(owner)
          Path('/tmp/iris-target-count.txt').write_text(str(len(owners)),encoding='utf-8')
          Path('/tmp/iris-target-owners.json').write_text(json.dumps(sorted(owners),indent=2),encoding='utf-8')
          print(f'Deleted {len(owners)} existing Iris assets for full rebuild.')
          print(json.dumps(sorted(owners),indent=2))
          PY

      - name: Rebuild MySQL and lock paid scope to Iris only
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/validate_mysql_content.sh
          python scripts/audio_pipeline.py plan --language de --level Pre-A1 > /tmp/pre-generate.json
          cat /tmp/pre-generate.json
          python - <<'PY'
          import json
          count=int(open('/tmp/iris-target-count.txt',encoding='utf-8').read())
          p=json.load(open('/tmp/pre-generate.json',encoding='utf-8'))
          expected={'totalRequired':149,'needsGeneration':count,'unresolvedVoices':0,'voiceLockPresent':True}
          bad={k:(p.get(k),v) for k,v in expected.items() if p.get(k)!=v}
          if bad:
              raise SystemExit(f'Paid scope is not exactly the Iris rebuild set: {bad}; targetCount={count}; plan={p}')
          if p.get('currentAssets') != 149-count:
              raise SystemExit(f'Unexpected currentAssets: {p}; targetCount={count}')
          print(f'Paid generation scope locked to exactly {count} Iris assets.')
          PY

      - name: Rebuild Iris audio from scratch
        run: >-
          python scripts/audio_pipeline.py generate
          --language de
          --level Pre-A1
          --confirm-paid-generation

      - name: Make mapping final-safe and validate everything
        shell: bash
        run: |
          set -euo pipefail
          python scripts/make_audio_mapping_final_safe.py --language de --level Pre-A1
          python scripts/audio_pipeline.py validate-assets --language de --level Pre-A1
          bash scripts/validate_mysql_content.sh
          python scripts/audio_pipeline.py plan --language de --level Pre-A1 > /tmp/post.json
          cat /tmp/post.json
          python - <<'PY'
          import json
          p=json.load(open('/tmp/post.json',encoding='utf-8'))
          expected={'totalRequired':149,'currentAssets':149,'needsGeneration':0,'unresolvedVoices':0,'voiceLockPresent':True}
          bad={k:(p.get(k),v) for k,v in expected.items() if p.get(k)!=v}
          if bad:
              raise SystemExit(f'Post-generation audio state is not exact: {bad}; plan={p}')
          PY
          python scripts/sync_audio_level_status.py --language de --level Pre-A1
          python scripts/validate_audio_contracts.py

      - name: Commit Iris voice and rebuilt assets directly to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add content/de/characters/iris.json
          git add -A config/audio-voice-locks/de.json database/audio/de audio/de/pre-a1 content/de/pre-a1/level.json
          if git diff --cached --quiet; then
            echo 'No Iris voice/audio changes to commit.' >&2
            exit 2
          fi
          git commit -m 'Replace Iris with German voice and rebuild audio'
          git push origin main
